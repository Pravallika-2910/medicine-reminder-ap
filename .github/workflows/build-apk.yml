name: Build Kivy APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip openjdk-17-jdk git zip unzip wget
        pip install --upgrade pip
        pip install buildozer Cython virtualenv

    - name: Prepare Android SDK & NDK
      run: |
        mkdir -p $HOME/.buildozer/android/platform
        cd $HOME/.buildozer/android/platform
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d cmdline-tools
        yes | cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk \
          "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393" "cmdline-tools;latest"

        echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
        echo "PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/platform-tools" >> $GITHUB_ENV

    - name: Initialize Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi

    - name: Configure buildozer.spec
      run: |
        sed -i 's/title = My Application/title = Medicine Reminder/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = medicinereminder/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.test/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,plyer/' buildozer.spec
        sed -i 's/# (str) Source code where the main.py live/source.dir = ./' buildozer.spec
        sed -i 's/# (list) Permissions/android.permissions = INTERNET, VIBRATE, FOREGROUND_SERVICE, WAKE_LOCK, RECEIVE_BOOT_COMPLETED/' buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec
        echo "android.sdk = 33" >> buildozer.spec
        echo "android.arch = arm64-v8a" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec

    - name: Build APK
      run: |
        export BUILDOZER_ALLOW_ROOT=1
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: medicine-reminder-apk
        path: bin/*.apk
